name: Fix Cooking Close Button Border

on:
  push:
    branches:
      - bugfix/recipe-detail-components

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore close button border color
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/RecipeCookingFlow.tsx')
          s = p.read_text()
          old = """                  backgroundColor:\n                    theme.colors\n                      .surface,\n                },\n              ]}\n            >\n              <X"""
          new = """                  backgroundColor:\n                    theme.colors\n                      .surface,\n                  borderColor:\n                    theme.colors\n                      .border,\n                },\n              ]}\n            >\n              <X"""
          if old not in s:
              raise SystemExit('close button pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RecipeCookingFlow.tsx
          git commit -m "fix: preserve Start Cooking close button border"
          git push origin HEAD:bugfix/recipe-detail-components
