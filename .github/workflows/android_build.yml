name: Android APK Build

on:
  push:
    branches:
      - main
      - bugfix/recipe-detail-components

  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Start Cooking border cleanup
        if: github.ref == 'refs/heads/bugfix/recipe-detail-components'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/RecipeCookingFlow.tsx')
          s = p.read_text()
          s = s.replace("""                  backgroundColor:\n                    theme.colors\n                      .surface,\n                  borderColor:\n                    theme.colors\n                      .border,\n""", """                  backgroundColor:\n                    theme.colors\n                      .surface,\n""", 2)
          s = s.replace("""  timerCard: {\n    minHeight: 90,\n\n    borderWidth: 1,\n    borderRadius: 8,\n""", """  timerCard: {\n    minHeight: 90,\n\n    borderRadius: 8,\n""")
          s = s.replace("""  cookIngredientCard: {\n    marginTop: 18,\n    borderWidth: 1,\n    borderRadius: 8,\n""", """  cookIngredientCard: {\n    marginTop: 18,\n    borderRadius: 8,\n""")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RecipeCookingFlow.tsx
          git commit -m "fix: remove decorative Start Cooking borders"
          git push origin HEAD:bugfix/recipe-detail-components

      - name: Set up Node.js
        if: github.ref != 'refs/heads/bugfix/recipe-detail-components'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: github.ref != 'refs/heads/bugfix/recipe-detail-components'
        run: npm ci

      - name: Set up Java
        if: github.ref != 'refs/heads/bugfix/recipe-detail-components'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: github.ref != 'refs/heads/bugfix/recipe-detail-components'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: github.ref != 'refs/heads/bugfix/recipe-detail-components'
        uses: gradle/actions/setup-gradle@v6

      - name: Generate debug keystore
        if: github.ref != 'refs/heads/bugfix/recipe-detail-components'
        working-directory: android/app
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradle executable
        if: github.ref != 'refs/heads/bugfix/recipe-detail-components'
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK
        if: github.ref != 'refs/heads/bugfix/recipe-detail-components'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        if: github.ref != 'refs/heads/bugfix/recipe-detail-components'
        uses: actions/upload-artifact@v4
        with:
          name: muveth-kitchen-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
