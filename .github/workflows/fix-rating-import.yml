name: Fix Rating Import

on:
  push:
    branches:
      - refactor/recipe-detail-components

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/RecipeDetailScreen.tsx')
          s = p.read_text()
          s = s.replace("  useRecipeDetail,\n  useUpdateRecipe,\n", "  useRecipeDetail,\n  useRateRecipe,\n  useUpdateRecipe,\n", 1)
          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/RecipeDetailScreen.tsx
          git commit -m "fix: restore recipe rating mutation import"
          git rm .github/workflows/fix-rating-import.yml
          git commit -m "chore: remove temporary rating fix workflow"
          git push origin HEAD:refactor/recipe-detail-components
