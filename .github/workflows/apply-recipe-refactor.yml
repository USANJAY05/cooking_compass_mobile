name: Apply Recipe Detail Refactor

on:
  push:
    branches:
      - refactor/recipe-detail-components

jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: python scripts/refactor_recipe_detail.py

      - name: Commit changes and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/RecipeDetailScreen.tsx src/components/PortionAdjuster.tsx src/components/recipe/RecipeRating.tsx src/components/recipe/RecipeNutrition.tsx
          git commit -m "refactor: extract recipe rating and nutrition components"
          git rm .github/workflows/apply-recipe-refactor.yml scripts/refactor_recipe_detail.py
          git commit -m "chore: remove temporary refactor tooling"
          git push origin HEAD:refactor/recipe-detail-components
