name: Final Recipe Detail Refactor

on:
  push:
    branches:
      - refactor/recipe-detail-components

jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/refactor_recipe_detail_v5.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/RecipeDetailScreen.tsx src/components/PortionAdjuster.tsx
          git commit -m "refactor: extract recipe rating and nutrition components"
          git rm .github/workflows/apply-final-recipe-refactor.yml scripts/refactor_recipe_detail.py scripts/refactor_recipe_detail_v2.py scripts/refactor_recipe_detail_v3.py scripts/refactor_recipe_detail_v4.py scripts/refactor_recipe_detail_v5.py REFRACTOR_TRIGGER_2.txt
          git commit -m "chore: remove temporary refactor tooling"
          git push origin HEAD:refactor/recipe-detail-components
